<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Yu Stellar Games Studio — Press Start">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0726"/>
      <stop offset="0.6" stop-color="#1d0f4a"/>
      <stop offset="1" stop-color="#3a1260"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cf7ff"/>
      <stop offset="0.5" stop-color="#c7a6ff"/>
      <stop offset="1" stop-color="#ff7eb6"/>
    </linearGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff3e7f" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff3e7f" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.18"/>
    </pattern>
    <style>
      .tw { animation: tw 2.4s ease-in-out infinite; }
      .tw2 { animation: tw 3.1s ease-in-out infinite 0.8s; }
      .tw3 { animation: tw 1.9s ease-in-out infinite 1.4s; }
      @keyframes tw { 0%, 100% { opacity: 1 } 50% { opacity: 0.15 } }
      .blink { animation: blink 1.1s steps(2, start) infinite; }
      @keyframes blink { to { visibility: hidden } }
      .ship { animation: float 3s ease-in-out infinite; }
      @keyframes float { 0%, 100% { transform: translate(0, 0) } 50% { transform: translate(0, -8px) } }
      .mono { font-family: "Courier New", ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 700; }
    </style>
  </defs>

  <rect width="1200" height="360" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <rect class="tw" x="64" y="42" width="4" height="4"/>
    <rect class="tw2" x="180" y="96" width="3" height="3"/>
    <rect class="tw3" x="290" y="34" width="4" height="4"/>
    <rect class="tw" x="402" y="120" width="2" height="2"/>
    <rect class="tw2" x="520" y="28" width="3" height="3"/>
    <rect class="tw3" x="660" y="72" width="2" height="2"/>
    <rect class="tw" x="760" y="30" width="4" height="4"/>
    <rect class="tw2" x="880" y="108" width="3" height="3"/>
    <rect class="tw3" x="990" y="48" width="4" height="4"/>
    <rect class="tw" x="1120" y="90" width="3" height="3"/>
    <rect class="tw2" x="120" y="180" width="2" height="2"/>
    <rect class="tw3" x="1060" y="170" width="2" height="2"/>
    <rect class="tw" x="1160" y="24" width="2" height="2"/>
    <rect class="tw3" x="30" y="130" width="2" height="2"/>
  </g>

  <!-- planet -->
  <circle cx="1040" cy="210" r="64" fill="#ff7eb6" opacity="0.85"/>
  <circle cx="1060" cy="196" r="64" fill="#3a1260" opacity="0.45"/>
  <ellipse cx="1040" cy="214" rx="104" ry="16" fill="none" stroke="#7cf7ff" stroke-width="4" opacity="0.7"/>

  <!-- pixel ship -->
  <g transform="translate(130 200)" fill="#7cf7ff">
    <g class="ship"><g transform="scale(6)">
      <rect x="3" y="0" width="2" height="1"/>
      <rect x="2" y="1" width="4" height="2"/>
      <rect x="0" y="3" width="8" height="2"/>
      <rect x="0" y="5" width="2" height="1"/>
      <rect x="6" y="5" width="2" height="1"/>
      <rect x="3" y="5" width="2" height="1" fill="#ff3e7f"/>
      <rect x="3" y="6" width="2" height="1" fill="#ffd166"/>
    </g></g>
  </g>

  <!-- synthwave floor -->
  <g stroke="url(#grid)" stroke-width="2">
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="318" x2="1200" y2="318"/>
    <line x1="0" y1="340" x2="1200" y2="340"/>
    <line x1="600" y1="290" x2="600" y2="360"/>
    <line x1="600" y1="290" x2="420" y2="360"/>
    <line x1="600" y1="290" x2="780" y2="360"/>
    <line x1="600" y1="290" x2="200" y2="360"/>
    <line x1="600" y1="290" x2="1000" y2="360"/>
    <line x1="600" y1="290" x2="-40" y2="360"/>
    <line x1="600" y1="290" x2="1240" y2="360"/>
  </g>

  <!-- title -->
  <text x="600" y="78" text-anchor="middle" class="mono" font-size="18" fill="#ffd166" letter-spacing="6">★ ★ ★  INSERT COIN  ★ ★ ★</text>
  <text x="604" y="160" text-anchor="middle" class="mono" font-size="64" fill="#ff3e7f" letter-spacing="4">YU STELLAR</text>
  <text x="600" y="156" text-anchor="middle" class="mono" font-size="64" fill="url(#title)" letter-spacing="4">YU STELLAR</text>
  <text x="600" y="210" text-anchor="middle" class="mono" font-size="30" fill="#e8e3ff" letter-spacing="10">GAMES STUDIO</text>
  <text x="600" y="262" text-anchor="middle" class="mono blink" font-size="22" fill="#ffffff" letter-spacing="6">▶ PRESS START</text>

  <rect width="1200" height="360" fill="url(#scan)"/>
</svg>
